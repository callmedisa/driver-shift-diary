# Runs the real app on an Android emulator against the real API and uploads
# the screenshots as build artifacts.
name: Devices

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Start the API (seeded from data/trips.json)
        run: docker compose up -d --build --wait

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: mobile

      - name: Build the release APK (checks the release manifest and signing setup)
        working-directory: mobile
        run: flutter build apk --release

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the app on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: mobile
          # 10.0.2.2 is the host machine (where the API runs) as seen from the emulator.
          script: flutter drive --driver=test_driver/integration_test.dart --target=integration_test/app_test.dart --dart-define=API_BASE_URL=http://10.0.2.2:8000 --dart-define=SCREENSHOTS=true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screenshots
          path: mobile/screenshots/
          if-no-files-found: warn

