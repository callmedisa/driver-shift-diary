services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DIARY_SEED_PATH: /data/trips.json
    volumes:
      - ./data:/data:ro
      - diary-db:/var/lib/diary
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  diary-db:
